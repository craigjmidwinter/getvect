# electron-builder configuration — `npm run dist`.
#
# Output lands in release/ (git-ignored): on macOS, release/mac-<arch>/GetVect.app
# plus a dmg and a zip; on Windows, an nsis installer. Run `npm run build` first;
# this packages dist/, it does not compile it.
#
# UNSIGNED ON PURPOSE, LOCALLY. `mac.identity: null` disables code signing, so
# what comes out of `npm run dist` is a local/ad-hoc build that Gatekeeper will
# quarantine on another machine.
#
# Release builds are signed and notarized, and the release workflow overrides
# `mac.identity` and `mac.notarize` on the command line rather than this file
# changing meaning depending on where it runs. The gate that decides whether a
# release may ship is not here either: it is in .github/workflows/release.yml,
# and it verifies the finished dmg rather than trusting that a signing step ran.
# See SIGNING.md.

appId: com.craigmidwinter.getvect
productName: GetVect
copyright: © 2026 Craig Midwinter

# Where `npm run dist -- --publish always` uploads, and — via the app-update.yml
# electron-builder writes into the bundle's resources — where the shipped app
# looks for its feed file when it checks for updates once per launch
# (src/main/updater.ts): `latest-mac.yml` on macOS, `latest.yml` on Windows.
#
# `releaseType: draft` is load-bearing. electron-builder creates the release,
# then uploads the dmg, the zip and latest-mac.yml one at a time; a release that
# went public at step one would be the newest release on GitHub — and therefore
# what the site's Download button resolves to — while it was still missing its
# assets. That window is wider now that two runners upload into the same
# release: the mac job can be finished while Windows is still packaging. The
# release workflow un-drafts as a final job that waits on both
# (.github/workflows/release.yml).
publish:
  provider: github
  owner: craigjmidwinter
  repo: getvect
  releaseType: draft

# THE FLIP-TO-AUTO SWITCH, and the only thing that has to change when a
# Developer ID certificate lands.
#
# electron-builder copies `extraMetadata` into the packaged package.json, so
# this is a property of the *build*, not of the source: the same commit can
# produce a signed `auto` build and an unsigned `notify` one. The app reads it
# at startup (`readUpdateMode` in src/main/updater.ts).
#
# It says `notify` because Squirrel.Mac refuses to install an update it cannot
# validate against the running app's signature, and this app is unsigned. An
# `auto` build here today would download ~150 MB on every launch and fail at the
# last step, forever. See src/shared/update.ts.
extraMetadata:
  updateMode: notify

directories:
  buildResources: build
  output: release

# The shipped app is the compiled bundle and nothing else. Vite inlines
# react / react-dom / imagetracerjs into dist/renderer, and the main process
# imports only `electron` plus node builtins — so node_modules is excluded
# outright. That is what keeps sharp's LGPL libvips and resvg's MPL code (both
# harness-only; see PUBLISH-CHECKLIST.md "Dependency licence hygiene") out of
# the distributed bundle. Sourcemaps and .d.ts files are build artefacts of the
# TypeScript step, not runtime inputs.
#
# The one runtime dependency that is not `electron` — electron-updater — obeys
# the same rule rather than earning an exception to it: `scripts/bundle-updater.mjs`
# compiles it and its sixteen transitive packages into
# `dist/main/vendor/electron-updater.js`, which the `dist/**/*` line below
# already ships. No allowlist to keep in sync, and exactly one readable file of
# vendored third-party code in the app.
files:
  - dist/**/*
  - package.json
  - '!node_modules/**/*'
  - '!dist/**/*.map'
  - '!dist/**/*.d.ts'
  - '!dist/.tsbuildinfo*'

# src/main/main.ts resolves this through `process.resourcesPath` when packaged;
# it is what puts the fox on the BrowserWindow on Linux and Windows. macOS takes
# its icon from the bundle's icns instead and ignores the window icon.
extraResources:
  # The third-party licence notice. MIT, BSD and Apache-2.0 all require their
  # text to ACCOMPANY the distribution, so a notice that exists only in the
  # repository does not discharge the obligation — it has to be in the bundle a
  # user receives. Generated by scripts/generate-third-party-notices.mjs from
  # what the bundlers actually included; `npm run build` regenerates it, so it
  # cannot drift from the code it describes.
  - from: build/third-party
    to: third-party
  - from: build/icon.png
    to: icon.png

# Nothing native ships (see `files`), so there is no reason to rebuild sharp
# against Electron's ABI — that step is slow and can fail on a clean machine.
npmRebuild: false

mac:
  icon: build/icon.icns
  category: public.app-category.graphics-design
  target:
    - dmg
    - zip

  # Unsigned local builds, unchanged. `identity: null` disables signing, and it
  # stays the default so `npm run dist` on a laptop behaves exactly as it always
  # has — no keychain prompt, no accidental signing with whatever identity
  # happens to be installed, no notarization attempt that would need an API key.
  #
  # THE RELEASE WORKFLOW OVERRIDES THIS ON THE COMMAND LINE, not here:
  #   -c.mac.identity="Developer ID Application: … (TEAMID)"
  #   -c.mac.notarize=true
  # so the difference between a local build and a shipped one is visible in the
  # workflow that makes the shipped one, rather than being a config default that
  # quietly means something different depending on who runs it.
  identity: null
  notarize: false

  # Required for notarization, and inert while identity is null. The entitlements
  # are the holes the hardened runtime has to leave open for Electron to run at
  # all — see build/entitlements.mac.plist, which explains each one.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # electron-builder's own Gatekeeper assessment during packaging. The release
  # workflow runs spctl against the finished dmg instead, because the artefact
  # is the thing that ships and the build is not.
  gatekeeperAssess: false

linux:
  icon: build/icon.png
  category: Graphics
  target:
    - AppImage

# Windows is a published platform as of the release that added `release-windows`
# to the workflow: the same tag produces the dmg/zip and the exe, and the same
# electron-builder run writes `latest.yml` — the Windows twin of `latest-mac.yml`
# — so an installed copy on either OS can discover the next version.
#
# `arch: x64` is stated rather than left to the default because the default is
# "whatever the runner is", and a silent flip to arm64 on some future
# windows-latest image would strand every existing installation: electron-updater
# matches the feed against the installed build, and an arm64 exe is not an
# update to an x64 one. x64 also runs under emulation on Windows-on-ARM, so one
# artefact reaches every Windows machine.
#
# artifactName mirrors the mac scheme (`GetVect-0.1.0-arm64.dmg`) instead of
# nsis's default `GetVect Setup 0.1.0.exe`. Same reason the site has to resolve
# downloads through the API: the version belongs in the filename, so a file
# sitting in a Downloads folder still says which GetVect it is. The default also
# carries a space, which is a small papercut in every URL and every terminal.
#
# nsis options are left at their defaults deliberately: a one-click, per-user
# install into %LOCALAPPDATA% needs no elevation, which matters for a build with
# no code-signing certificate behind it — an unsigned installer asking for admin
# is the exact shape of the thing people are told not to run.
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

name: Release

# Tag-driven, and the tag is the source of truth for the version.
#
# The ritual is three commands (PUBLISH-CHECKLIST.md, "Cutting a release"):
#
#     npm version 0.1.1 --no-git-tag-version   # bump package.json
#     git commit -am "Release 0.1.1" && git push
#     git tag v0.1.1 && git push origin v0.1.1
#
# Every build job refuses to start if `v<package.json version>` is not the tag
# that triggered it. A release whose package.json says 0.1.0 and whose dmg is
# called 0.1.1 is a release that lies to its own updater — `latest-mac.yml` and
# `latest.yml` carry the version the *app* reports, and every subsequent update
# check compares against it.
#
# FOUR JOBS, AND THE SHAPE IS THE POINT. `draft` opens exactly one release,
# `mac` and `windows` build in parallel and upload into it, `publish` un-drafts
# only once both have finished. A release is never public with half its assets,
# and no visitor to the site is ever offered a platform whose artefact is still
# uploading.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v0.1.0'
        required: true

# `contents: write` is what lets electron-builder create the release and upload
# assets to it. Nothing else is needed.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # THE DRAFT IS CREATED HERE, NOT BY electron-builder — and that ordering is
  # the fix for a real failure, not a preference.
  #
  # electron-builder runs one publisher per target (zip, dmg). Both look for an
  # existing release by tag, both find nothing, and both create one: GitHub
  # happily accepts two *drafts* sharing a tag, because a draft has no tag to
  # collide on until it is published. The first attempt at v0.1.0 produced
  # exactly that — two drafts, the dmg and latest-mac.yml in one, a lone
  # blockmap in the other, and a release the updater could not read.
  #
  # A release that already exists when electron-builder starts closes the race:
  # every publisher finds it and uploads into it. With two runners packaging at
  # once the race is no longer theoretical, which is why this is its own job
  # rather than a step inside the mac build — a job both builds must wait for is
  # the only way to guarantee exactly one release exists before either starts.
  draft:
    name: check the version · open the draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: The tag and package.json must agree
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json ($PKG). Bump the version, commit, then tag."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## GetVect $VERSION

          Raster → vector, on your machine. Drop in a PNG, JPEG or BMP; get back SVG, EPS, DXF, PDF or PNG.

          **macOS, Apple Silicon** — download \`GetVect-$VERSION-arm64.dmg\`.
          **Windows, x64** — download \`GetVect-$VERSION-x64.exe\`.

          ### Signing

          **macOS is signed and notarized.** The dmg carries an Apple Developer ID signature and
          a stapled notarization ticket, so it opens with no Gatekeeper warning. Check it
          yourself rather than taking our word for it:

          \`\`\`
          spctl -a -t install -vv GetVect-$VERSION-arm64.dmg   # accepted / source=Notarized Developer ID
          codesign -dvvv /Applications/GetVect.app             # TeamIdentifier=6UV93L24YL
          \`\`\`

          **Windows is not signed.** There is no Authenticode certificate, so SmartScreen shows
          "Windows protected your PC" — choose **More info**, then **Run anyway**. The installer
          is per-user and never asks for administrator rights.

          ### Updates

          **macOS installs updates in place.** Because the build is signed, the app can verify
          and apply a new version itself: it downloads in the background, then offers
          **Restart**. Choosing it swaps the app and reopens on the new version.

          **Windows tells you and does not install.** Without an Authenticode certificate the
          install step cannot be verified, so it links you to the release instead.

          Either way it is one check per launch, no identifier is sent, and
          \`GETVECT_NO_UPDATE_CHECK=1\` turns it off entirely — before any request, on both
          platforms.

          ### Network

          Two network touchpoints, both in your control: optional AI Enhance, and a
          once-per-launch update check against GitHub Releases (disable with
          \`GETVECT_NO_UPDATE_CHECK=1\`). Everything else — ingest, tracing, preview and every
          export — runs offline.

          Full docs: <https://getvect.midwinter.io/docs.html>
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; reusing it"
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --title "GetVect $VERSION" --notes-file notes.md
          fi

  mac:
    name: build · publish · macOS
    # The dmg and the zip can only be made on macOS, and so can the icns the
    # bundle carries.
    runs-on: macos-latest
    needs: draft
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Repeated per build job rather than trusted from `draft`. It is four
      # lines, it reads package.json on the machine that is about to package it,
      # and it fails a job that somehow checked out the wrong ref.
      - name: The tag and package.json must agree
        run: |
          TAG="${{ needs.draft.outputs.tag }}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json ($PKG). Bump the version, commit, then tag."
            exit 1
          fi

      # THE ABSENT-CREDENTIAL BRANCH IS A FAILURE, NOT A SKIP.
      #
      # This step has no `if:`. That is the whole design. The standard way this
      # gate breaks is a condition like `if: secrets.CSC_LINK != ''` guarding
      # the signing steps — which cannot tell "this is not a release" from
      # "someone deleted the secret", and silently publishes an unsigned build
      # in the second case with a green check on the run.
      #
      # This workflow only ever runs on a release tag or a manual release
      # dispatch, so there is no legitimate path here that does not need to
      # sign. Absent credentials is a hard error, named, before anything is
      # built — not after twenty minutes of packaging.
      - name: Signing credentials must be present
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -uo pipefail
          missing=""
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD \
                      NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::macOS release signing is not configured. Missing repository secret(s):$missing"
            echo "::error::A release cannot be published unsigned. See SIGNING.md for what each one is and how to set it."
            exit 1
          fi
          echo "all five signing secrets are present"

      - name: Install dependencies
        run: npm ci

      # The fast gate, deliberately not the full acceptance suite: typecheck
      # plus the engine contracts (determinism, setting semantics, SVG/EPS/DXF/
      # PDF structure, alpha handling) are pure Node, take a couple of minutes,
      # and are what would make a shipped build *wrong*. Driving a real Electron
      # window on a hosted runner is still too flaky to stand between a tag and
      # a release — see the disabled `e2e` job in ci.yml.
      - name: Typecheck
        run: npm run typecheck

      - name: Engine contract tests
        run: npm run test:engine

      - name: Build
        run: npm run build

      # `--publish always` rather than `gh release create`, because only
      # electron-builder writes `latest-mac.yml` — the feed file the shipped
      # app reads, carrying each artefact's sha512 and size. A release assembled
      # by hand would have a dmg and a zip and no way for any installed copy to
      # ever learn about it.
      #
      # The release stays a draft (electron-builder.yml, `publish.releaseType`)
      # until the `publish` job un-drafts it.
      # A dedicated keychain rather than the login one: it is created here,
      # unlocked here, and destroyed when the runner is torn down, so nothing
      # persists and nothing else on the machine can be signed with it by
      # accident. `set +x` is belt-and-braces — the password is a secret and
      # masked, but a traced shell is how masked values end up in logs anyway.
      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set +x
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          P12="$RUNNER_TEMP/cert.p12"

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # THE APPLE INTERMEDIATE, AND IT IS NOT OPTIONAL.
          #
          # A leaf certificate with no chain to a trusted root is not a signing
          # identity, and the symptom is the least helpful message in this whole
          # process: `security find-identity` reports "0 valid identities found"
          # while the certificate is demonstrably present in the keychain. It
          # cost real time locally before anyone realised the import had worked
          # and the chain had not. A fresh runner has no Apple intermediates, so
          # CI would hit exactly this every time.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" \
            -T /usr/bin/codesign || true

          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$P12"

          # An import that "succeeded" without producing a usable identity is
          # what BOTH known traps look like from here: a cert without its
          # private key, or a cert whose chain is missing. Checking the count
          # rather than the import's exit status is the difference between
          # failing here with a named cause and failing twenty minutes later
          # inside electron-builder with an opaque one.
          COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c 'Developer ID Application' || true)
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::the certificate imported but no Developer ID Application identity is usable."
            echo "::error::Two known causes, both of which look like this: the p12 holds a certificate"
            echo "::error::without its private key, or the Apple intermediate is missing so the leaf has"
            echo "::error::no chain. See SIGNING.md, 'Two traps'."
            exit 1
          fi
          echo "usable Developer ID identities: $COUNT"

      # Fail on bad notary credentials in seconds, not after a twenty-minute
      # package-and-upload. `notarytool history` on a fresh key prints "No
      # submission history." and exits 0 — that IS the success case, and it is
      # the cheapest possible proof that the key, the key id and the issuer id
      # agree with each other and with Apple.
      - name: The notary credentials must authenticate
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set +x
          set -euo pipefail
          KEY="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY"
          if ! xcrun notarytool history --key "$KEY" \
                 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" >/dev/null 2>&1; then
            rm -f "$KEY"
            echo "::error::the notary credentials did not authenticate with Apple."
            echo "::error::Check NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID and NOTARY_ISSUER_ID agree with each other. See SIGNING.md."
            exit 1
          fi
          rm -f "$KEY"
          echo "notary credentials authenticate"

      # PACKAGE, THEN FINISH THE DMG, THEN UPLOAD — in that order, deliberately.
      #
      # This used to be `--publish always`, which packages, hashes and uploads in
      # one move. That is exactly what could not work: electron-builder staples
      # the .app and then wraps it in a disk image it does not sign, so the file
      # a user downloads had no signature and no ticket while every log said
      # notarization succeeded. Fixing the dmg afterwards changes its bytes, and
      # the sha512 already written into latest-mac.yml — which the shipped app's
      # updater trusts — would then describe a file that no longer exists.
      #
      # So packaging no longer publishes. scripts/notarize-dmg.mjs signs,
      # notarizes and staples the dmg and re-indexes the feed against the
      # finished file, and the upload happens last.
      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder reads these three for notarization. APPLE_API_KEY
          # is a PATH, not the key itself.
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          CSC_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          # NO "Developer ID Application:" PREFIX. electron-builder rejects the
          # full certificate common name with:
          #
          #   ⨯ Please remove prefix "Developer ID Application:" from the
          #     specified name — appropriate certificate will be chosen automatically
          #
          # which is the string every other Apple tool wants and the one you get
          # from `security find-identity`. Found by running the real signed build
          # locally; in CI it would have failed on the first release tag, after
          # packaging, with the certificate correctly installed and nothing wrong
          # except this string.
          SIGN_IDENTITY: "${{ vars.MACOS_SIGN_IDENTITY || 'Craig Midwinter (6UV93L24YL)' }}"
        run: |
          set +x
          set -euo pipefail
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY"
          # updateMode=auto is a MAC-JOB-ONLY override, and it must stay that way.
          # It is baked into the packaged package.json, so it describes the build
          # rather than the source; the Windows job below builds from the same
          # commit and keeps `notify`, because the exe has no Authenticode
          # certificate and Squirrel would refuse the install. A repo-level flip
          # in electron-builder.yml would silently turn it on for Windows too.
          #
          # `npm run dist` on a laptop is also unaffected: it never passes this,
          # so an unsigned local build still cannot try to update itself.
          npm run dist -- --mac --publish never \
            -c.mac.identity="$SIGN_IDENTITY" \
            -c.mac.notarize=true \
            -c.extraMetadata.updateMode=auto

      # THE LICENCE NOTICE HAS TO BE IN THE BUNDLE, NOT JUST IN THE REPO.
      #
      # MIT, BSD and Apache-2.0 require their text to ACCOMPANY the
      # distribution. v0.1.3 and v0.1.4 both shipped with zero licence files —
      # not even Electron's own — and nothing noticed, because the repo looked
      # correct and only the artefact was wrong.
      #
      # `npm run build` regenerates build/third-party and `extraResources` ships
      # it, but that is two assumptions about other tools' behaviour on a path
      # that might not exist. Neither fails loudly on its own, and the result is
      # a binary that is out of compliance while every step is green — so it is
      # checked on the packaged bundle rather than believed.
      - name: The app must carry its third-party licence notice
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac-*/GetVect.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::no packaged .app to check"
            exit 1
          fi
          for app in "${apps[@]}"; do
            res="$app/Contents/Resources/third-party"
            for f in THIRD-PARTY-LICENSES.md electron-LICENSE.txt LICENSES.chromium.html; do
              if [ ! -s "$res/$f" ]; then
                echo "::error::$app is missing $f — it would ship without the licence text its dependencies require"
                exit 1
              fi
            done
            # A notice can exist and still say nothing; the generator has its own
            # floors, this one guards the copy that actually reached the bundle.
            bytes=$(wc -c < "$res/THIRD-PARTY-LICENSES.md")
            if [ "$bytes" -lt 20000 ]; then
              echo "::error::the shipped notice is $bytes bytes — implausibly small"
              exit 1
            fi
            echo "  $app: notice present ($bytes bytes) + Electron and Chromium licences"
          done

      - name: Sign, notarize and staple the dmg, then re-index the feed
        env:
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          CSC_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          SIGN_IDENTITY: "${{ vars.MACOS_SIGN_IDENTITY || 'Developer ID Application: Craig Midwinter (6UV93L24YL)' }}"
        run: |
          set -euo pipefail
          node scripts/notarize-dmg.mjs release
          rm -f "$APPLE_API_KEY"

      # THE ARTEFACT, NOT THE BUILD.
      #
      # Everything above can succeed and still leave a dmg that a user cannot
      # open: a notarization that was issued but never stapled, a signature that
      # does not cover a nested helper, a certificate Gatekeeper will not accept.
      # "The signing step ran" and "this file is signed" are different claims,
      # and only the file can answer the second one.
      - name: The dmg must be signed, accepted and stapled
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::no dmg in release/ to verify — packaging produced nothing to ship"
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            bash scripts/verify-signed-dmg.sh "$dmg"
          done

      # THE ARTEFACT THE SOFTWARE GETS, not the one a person gets.
      #
      # latest-mac.yml's top-level path/sha512 point at the ZIP, and
      # electron-updater installs from it — never from the dmg. So verifying only
      # the dmg checked the download a human makes and left the download the app
      # makes unchecked, and only one of those two runs unattended on someone
      # else's machine.
      #
      # With updateMode=auto this is load-bearing: Squirrel validates the new
      # bundle's signature against the running app's and refuses a mismatch AFTER
      # the ~120 MB download, on every launch, silently. A build log cannot see
      # that; this file can.
      - name: The update zip must contain a signed, stapled app
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(release/*-mac.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::no mac zip in release/ — the update feed would point at nothing"
            exit 1
          fi
          for zip in "${zips[@]}"; do
            bash scripts/verify-signed-zip.sh "$zip"
          done

      # Upload only after the artefact has passed. Nothing reaches the release
      # until the file itself is signed, Gatekeeper-accepted and stapled, and the
      # feed has been re-indexed against it.
      - name: Upload the verified artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.dmg release/*-mac.zip release/*-mac.zip.blockmap release/latest-mac.yml)
          if [ ${#files[@]} -lt 3 ]; then
            echo "::error::expected a dmg, a zip and latest-mac.yml in release/; found: ${files[*]:-none}"
            exit 1
          fi
          printf '  %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

          # The feed must describe what was actually uploaded. Re-reading it here
          # is cheap and catches a re-index that silently did nothing.
          DMG=$(ls release/*.dmg | head -1)
          WANT=$(awk '/url: .*\.dmg/{f=1} f&&/sha512:/{print $2; exit}' release/latest-mac.yml)
          GOT=$(openssl dgst -sha512 -binary "$DMG" | base64)
          if [ "$WANT" != "$GOT" ]; then
            echo "::error::latest-mac.yml does not match the stapled dmg it was uploaded with"
            exit 1
          fi
          echo "feed digest matches the stapled dmg"

  windows:
    name: build · publish · Windows
    runs-on: windows-latest
    needs: draft
    timeout-minutes: 45

    # Git bash, not pwsh. The steps below are the mac steps, and a release
    # workflow whose two halves drift apart in shell dialect is a workflow where
    # a fix lands on one platform only. `bash` ships on every windows-latest
    # image; this line is what lets the version guard be the same four lines of
    # sh on both runners rather than a pwsh translation of them.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: The tag and package.json must agree
        run: |
          TAG="${{ needs.draft.outputs.tag }}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json ($PKG). Bump the version, commit, then tag."
            exit 1
          fi

      # Plain `npm ci`, and that it works here at all is recent: the postinstall
      # step used to run `xattr` unconditionally, which does not exist on
      # Windows, so every install died on a macOS-only de-quarantine. It is
      # guarded by a platform check now (package.json). If this step ever starts
      # failing, that guard is the first place to look — the workaround people
      # reach for, `--ignore-scripts`, would skip electron's own installer too
      # and leave nothing to package.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Engine contract tests
        run: npm run test:engine

      - name: Build
        run: npm run build

      # Writes `latest.yml` into the same draft release the mac job is writing
      # `latest-mac.yml` into. electron-updater picks its feed by platform, so
      # both must be present on one release for both platforms to see it.
      # WINDOWS SIGNING: PRESENT, AND OFF UNTIL A PROVIDER EXISTS.
      #
      # There is no Authenticode certificate yet. The rule the macOS half is held
      # to — absent credentials on a release tag is a hard failure, never a skip —
      # is right, and applying it to Windows *today* would not prevent shipping
      # unsigned, it would prevent shipping at all, because there is no credential
      # to supply. That is a release freeze, not a gate.
      #
      # So the switch is an explicit repository VARIABLE, `WINDOWS_SIGNING`, and
      # the distinction from the antipattern is the whole point:
      #
      #   `if: secrets.X != ''`   cannot tell "not configured" from "someone
      #                           deleted the secret" — it fails open, silently.
      #   `vars.WINDOWS_SIGNING`  is a deliberate, version-controlled declaration
      #                           that a human set. A deleted secret while it is
      #                           on is a HARD FAILURE, exactly like macOS.
      #
      # Turning it on without wiring a provider is also safe: the verification
      # below then fails, which is correct, because the artefact would not be
      # signed. There is no configuration of this that ships an unsigned exe
      # while claiming otherwise.
      - name: Windows signing policy
        env:
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING }}
          WINDOWS_CERT_PRESENT: ${{ secrets.WINDOWS_SIGNING_TOKEN != '' }}
        run: |
          set -uo pipefail
          if [ "${WINDOWS_SIGNING:-}" != "enabled" ]; then
            echo "::warning::Windows signing is not enabled — this release ships an UNSIGNED .exe."
            echo "::warning::SmartScreen will warn users. The release notes and the download page say so."
            exit 0
          fi
          if [ "$WINDOWS_CERT_PRESENT" != "true" ]; then
            echo "::error::WINDOWS_SIGNING is enabled but the signing credential is missing."
            echo "::error::A release cannot be published unsigned. Set the credential or unset the variable deliberately."
            exit 1
          fi
          echo "windows signing enabled and credential present"

      - name: Package and publish
        run: npm run dist -- --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same rule as the dmg: verify the artefact, not the step that made it.
      # Guarded on the VARIABLE, never on the secret — see above.
      - name: The exe must carry a valid signature
        if: vars.WINDOWS_SIGNING == 'enabled'
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Path release -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $exes) { Write-Error "::error::no .exe in release/ to verify"; exit 1 }
          $failed = $false
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            Write-Host "$($exe.Name): $($sig.Status)"
            Write-Host "  signer: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::$($exe.Name) signature is $($sig.Status), expected Valid"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  verify-download:
    name: verify · the asset a user gets
    # macOS because codesign, spctl and stapler exist nowhere else. This is the
    # reason this is a separate job rather than a step in `publish`, which runs
    # on ubuntu.
    runs-on: macos-latest
    needs: [draft, mac, windows]
    timeout-minutes: 20

    steps:
      # Only the script — no build, no packaging. Checking out the repo here is
      # for the verifier itself, and nothing in this job may read release/.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # THE FILE YOU VERIFIED AND THE FILE A USER GETS ARE ONLY THE SAME FILE IF
      # YOU CHECK.
      #
      # The mac job verified a dmg in its own release/ directory. This downloads
      # what is actually attached to the release and verifies that instead. The
      # two are supposed to be identical, and the entire point is that "supposed
      # to be" is the assumption every sibling-artefact failure is made of — an
      # upload that truncated, a re-run that replaced one asset and not another,
      # a name collision between two runners writing into one release.
      #
      # It runs while the release is still a draft, so a failure here means
      # nothing was ever public.
      - name: Download the dmg and the update zip from the release and verify both
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/downloaded"
          cd "$RUNNER_TEMP/downloaded"
          gh release download "$TAG" --pattern '*.dmg' --clobber
          gh release download "$TAG" --pattern '*-mac.zip' --clobber
          shopt -s nullglob
          dmgs=(*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::the release carries no dmg to download"
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            bash "$GITHUB_WORKSPACE/scripts/verify-signed-dmg.sh" "$PWD/$dmg"
          done
          # Same file the shipped app's updater will fetch, fetched the same way.
          zips=(*-mac.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::the release carries no mac zip — in-app updates would 404"
            exit 1
          fi
          for zip in "${zips[@]}"; do
            bash "$GITHUB_WORKSPACE/scripts/verify-signed-zip.sh" "$PWD/$zip"
          done

  publish:
    name: verify · un-draft
    runs-on: ubuntu-latest
    # verify-download is in `needs` so the release cannot be un-drafted unless
    # the asset actually attached to it passed all three checks.
    needs: [draft, mac, windows, verify-download]
    timeout-minutes: 10

    steps:
      # Exactly one release for this tag, carrying every artefact from both
      # runners. The count check is not paranoia: duplicate drafts are the
      # specific way this has already gone wrong, and they are invisible on the
      # releases page until one of them is published.
      #
      # Both feed files are checked by name. A release with a dmg and no
      # latest-mac.yml — or an exe and no latest.yml — is a release half the
      # installed copies can never discover, and it looks completely fine on the
      # releases page.
      # No checkout in this job — there is nothing to build, only a release to
      # inspect — so `gh` is told which repo it is talking about explicitly
      # rather than inferring it from a git remote that is not there.
      - name: The release must be one release with every artefact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          set -euo pipefail
          COUNT=$(gh api repos/${{ github.repository }}/releases --jq "[.[] | select(.tag_name == \"$TAG\")] | length")
          if [ "$COUNT" != "1" ]; then
            echo "::error::$COUNT releases carry the tag $TAG; expected exactly 1"
            exit 1
          fi
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          for want in '\.dmg$' '\.zip$' '^latest-mac\.yml$' '\.exe$' '^latest\.yml$'; do
            echo "$ASSETS" | grep -qE "$want" || { echo "::error::no asset matching $want"; exit 1; }
          done

      # Last: the release goes public only once every asset from every platform
      # is up and checked.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest

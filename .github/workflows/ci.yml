name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here touches the token beyond checkout; say so, like every other
# workflow in this directory does, instead of inheriting the repo default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · engine tests · build
    # macOS is the platform GetVect is developed and released on, and the postinstall
    # step that de-quarantines Electron is macOS-specific.
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Engine contract tests
        # Pure Node, no Electron, no display needed. These are the fidelity contracts:
        # determinism, setting semantics, SVG/EPS/DXF/PDF structure, alpha handling.
        run: npm run test:engine

      - name: Build
        run: npm run build

      - name: Derived assets are not stale
        # The README's before/after, the landing page's demo SVG and the app
        # icon are engine output. They went a week out of date once — the live
        # demo served a trace made before the alpha-ingest fix — so the
        # freshness is checked rather than remembered. Needs the build above
        # (the SVG is re-traced and diffed byte-for-byte), and iconutil, which
        # is why this job is on macOS.
        run: node scripts/regenerate-derived-assets.mjs --check

      - name: Devlog still carries its tag, disclosure and social card
        # site/devlog/ is `katra build` output copied across by hand at publish
        # time, so injecting at build time only protects the build. A rebuild
        # that skipped the injector would drop all three from the page that
        # actually ships — and the page would still render perfectly, which is
        # why this is checked rather than noticed.
        run: node scripts/devlog-analytics.mjs --check

  # ---------------------------------------------------------------------------
  # Playwright acceptance suite (tests/e2e). Not enabled yet: driving a real
  # Electron window on a hosted runner is flaky — window activation, GPU and
  # code-signing all differ from a developer machine, and a red run that means
  # "CI is CI" trains everyone to ignore the badge.
  #
  # To turn it on: uncomment, and expect to need a display on Linux runners
  # (`xvfb-run -a npx playwright test`). Do NOT add `npx playwright install`;
  # the suite uses the `_electron` launcher and needs no browser download.
  # ---------------------------------------------------------------------------

<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #f6f4ef; }
  svg text { font-family: -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    body { background: #f6f4ef; }
  }
</style>
<svg viewBox="0 0 860 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The pit crew gauntlet loop">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#44403c"/>
    </marker>
  </defs>

  <!-- reference -->
  <rect x="20" y="140" width="170" height="100" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="105" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">REFERENCE</text>
  <text x="105" y="190" text-anchor="middle" font-size="12" fill="#78350f">the reference product behavior</text>
  <text x="105" y="207" text-anchor="middle" font-size="12" fill="#78350f">+ real artwork exports</text>
  <text x="105" y="224" text-anchor="middle" font-size="12" fill="#78350f">+ measurable bar</text>

  <!-- builder -->
  <rect x="280" y="40" width="150" height="70" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="355" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">BUILDERS</text>
  <text x="355" y="92" text-anchor="middle" font-size="12" fill="#1e3a8a">Opus, sequential slices</text>

  <!-- artifact -->
  <rect x="510" y="40" width="130" height="70" rx="10" fill="#e7e5e4" stroke="#57534e" stroke-width="1.5"/>
  <text x="575" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#292524">THE APP</text>
  <text x="575" y="92" text-anchor="middle" font-size="12" fill="#292524">Electron artifact</text>

  <!-- critics -->
  <rect x="690" y="140" width="150" height="100" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="765" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">CRITICS ×3</text>
  <text x="765" y="190" text-anchor="middle" font-size="12" fill="#7f1d1d">fresh context, blind A/B</text>
  <text x="765" y="207" text-anchor="middle" font-size="12" fill="#7f1d1d">acceptance · fidelity · UX</text>
  <text x="765" y="224" text-anchor="middle" font-size="12" fill="#7f1d1d">evidence required</text>

  <!-- pit crew -->
  <rect x="280" y="270" width="360" height="80" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
  <text x="460" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">PIT CREW</text>
  <text x="460" y="318" text-anchor="middle" font-size="12" fill="#14532d">reference → executable checks · fidelity instruments · screenshot rig</text>
  <text x="460" y="336" text-anchor="middle" font-size="12" fill="#14532d">standing rule: any note a critic gives twice becomes a check</text>

  <!-- arrows -->
  <line x1="190" y1="165" x2="285" y2="95" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="215" y="115" font-size="11" fill="#57534e">quality bar</text>

  <line x1="430" y1="75" x2="505" y2="75" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="443" y="65" font-size="11" fill="#57534e">build lap</text>

  <line x1="640" y1="95" x2="700" y2="140" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="650" y="112" font-size="11" fill="#57534e">judge</text>

  <line x1="190" y1="215" x2="685" y2="200" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="400" y="196" font-size="11" fill="#92400e">blind A/B vs real exports</text>

  <line x1="765" y1="240" x2="645" y2="300" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="690" y="278" font-size="11" fill="#57534e">gaps + repeated notes</text>

  <line x1="355" y1="270" x2="355" y2="115" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="230" y="250" font-size="11" fill="#57534e">failing tests pick the next lap</text>

  <text x="430" y="30" font-size="13" font-weight="600" fill="#57534e">loop until score ≥ 8.5 with no major gaps, cap 5 laps</text>
</svg>

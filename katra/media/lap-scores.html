<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #f6f4ef; }
  svg text { font-family: -apple-system, "Segoe UI", sans-serif; }
</style>
<svg viewBox="0 0 860 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Integration critic score by lap">
  <text x="20" y="26" font-size="14" font-weight="700" fill="#292524">Fresh-context critic score by lap (0–10), bar = 8.5 with no major gaps</text>

  <!-- axes: x 80..800 laps 1..5, y: score 5..9 -> y = 260 - (s-5)*50 -->
  <line x1="80" y1="260" x2="820" y2="260" stroke="#57534e"/>
  <line x1="80" y1="60" x2="80" y2="260" stroke="#57534e"/>
  <g font-size="11" fill="#57534e">
    <text x="70" y="264" text-anchor="end">5</text>
    <text x="70" y="214" text-anchor="end">6</text>
    <text x="70" y="164" text-anchor="end">7</text>
    <text x="70" y="114" text-anchor="end">8</text>
    <text x="70" y="64" text-anchor="end">9</text>
  </g>
  <line x1="80" y1="85" x2="820" y2="85" stroke="#b45309" stroke-dasharray="6 4"/>
  <text x="815" y="79" font-size="11" fill="#92400e" text-anchor="end">the bar: 8.5</text>

  <!-- lap 1: three critics at x=170 -->
  <circle cx="170" cy="210" r="5" fill="#a8a29e"/>
  <circle cx="170" cy="160" r="5" fill="#a8a29e"/>
  <circle cx="182" cy="210" r="5" fill="#a8a29e"/>
  <text x="170" y="238" font-size="11" fill="#57534e" text-anchor="middle">3 critics: 6 / 7 / 6</text>

  <!-- integration verdicts: lap2 (7)=160, lap3 7.4=140, lap4 8=110, lap5 7.5=135 -->
  <polyline points="330,160 490,140 650,110 810,135" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="330" cy="160" r="6" fill="#1d4ed8"/>
  <circle cx="490" cy="140" r="6" fill="#1d4ed8"/>
  <circle cx="650" cy="110" r="6" fill="#1d4ed8"/>
  <circle cx="810" cy="135" r="6" fill="#1d4ed8"/>
  <g font-size="12" font-weight="600" fill="#1e3a8a">
    <text x="330" y="182" text-anchor="middle">7.0</text>
    <text x="490" y="162" text-anchor="middle">7.4</text>
    <text x="650" y="98" text-anchor="middle">8.0</text>
    <text x="810" y="123" text-anchor="middle">7.5</text>
  </g>
  <g font-size="11" fill="#57534e">
    <text x="170" y="280" text-anchor="middle">lap 1</text>
    <text x="330" y="280" text-anchor="middle">lap 2</text>
    <text x="490" y="280" text-anchor="middle">lap 3</text>
    <text x="650" y="280" text-anchor="middle">lap 4</text>
    <text x="810" y="280" text-anchor="middle">lap 5</text>
  </g>
  <text x="700" y="160" font-size="11" fill="#7f1d1d">lap-5 dip = a deeper instrument,</text>
  <text x="700" y="175" font-size="11" fill="#7f1d1d">not a worse app</text>
</svg>
